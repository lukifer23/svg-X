name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run ci:check
      - run: npm run test:archival
        if: runner.os == 'Linux'
      - name: Validate independent export consumers
        if: runner.os == 'Linux'
        env:
          SVGX_EXPORT_PYTHON: /usr/bin/python3
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript python3-ezdxf
          npm run test:export-consumers

  package:
    name: Unsigned distribution (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run electron:build
      - name: Install Linux distribution test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xdotool libfuse2t64
      - name: Install Chromium for packaged LAN parity
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate Linux distribution files
        if: runner.os == 'Linux'
        env:
          SVGX_NATIVE_BATCH: "1"
          SVGX_GTK_PICKER: "1"
          SVGX_TEST_LAN: "1"
        run: xvfb-run --auto-servernum bash scripts/test-distribution.sh
      - name: Validate macOS distribution files
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/test-distribution.sh
      - name: Validate Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem release -File -Filter '*.exe')
          if ($portable.Count -ne 1) { throw 'Expected one portable EXE in release/' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $portable[0].FullName
          $env:SVGX_PACKAGE_EXE = $portable[0].FullName
          $env:SVGX_TEST_PORTABLE = '1'
          npm run test:e2e:package

  browser-e2e:
    name: Browser E2E
    needs: validate
    runs-on: ubuntu-latest
    container:
      # Keep the image version aligned with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run test:e2e:web:functional
        env:
          # Firefox requires the home directory to belong to the container user.
          HOME: /root

  performance:
    name: Batch performance regression
    runs-on: windows-latest
    # Shared hosted runners are intentionally a regression signal, not the
    # controlled-hardware 1.50x release acceptance measurement.
    env:
      SVGX_MIN_BATCH_SPEEDUP: "1.25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm run test:e2e:performance
