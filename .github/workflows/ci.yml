name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run ci:check

  package:
    name: Unsigned package (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run package:dir
      - name: Launch packaged application smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            DEBUG=pw:browser* ELECTRON_ENABLE_LOGGING=1 xvfb-run --auto-servernum npm run test:e2e:package
          else
            npm run test:e2e:package
          fi
      - name: Verify unpacked application exists
        shell: bash
        run: test -n "$(find release -maxdepth 3 -type f | head -n 1)"

  browser-e2e:
    name: Browser E2E
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:web:functional

  performance:
    name: Batch performance
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm run test:e2e:performance
